server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: smart-placement-system

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_placement_db}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      pool-name: SmartPlacementHikariCP

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

# Application-specific Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:dev_placeholder_jwt_secret_key_must_be_at_least_256_bits_for_hmac_sha256_security_000}
    expiration-ms: ${JWT_EXPIRATION_MS:${JWT_EXPIRATION:86400000}} # 24 hours default in ms
  upload:
    dir: ${FILE_UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed-demo-data: ${SEED_DEMO_DATA:true}

# Spring Boot Actuator (Cloud Health Probes - ONLY health endpoint exposed)
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI / Swagger Documentation Config
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# Logging Configuration
logging:
  level:
    com.smartplacement: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
