version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: smart-placement-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${DB_NAME:-smart_placement_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - spms-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-placement-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smart_placement_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root_dev_password}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-dev_test_jwt_secret_must_be_minimum_32_bytes_long_0000000000000000}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://frontend:80"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      FILE_UPLOAD_DIR: "/app/uploads"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - spms-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-placement-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - spms-network

volumes:
  mysql_data:
  uploads_data:

networks:
  spms-network:
    driver: bridge
